[LiveChat]
; Lokasi file yang ditulis bridge.js. Kalau hanya nama file, dicari di folder yang sama dengan livechat.asi.
; Contoh pakai file yang sama seperti sebelumnya:
; File=D:\GAME\GTA SAN ANDREAS FIXED\moonloader\livechat.jsonl
File=livechat.jsonl
; Maksimal baris teks di layar
MaxLines=14
; Komentar hilang setelah sekian detik
LifetimeSec=20
; Posisi vertikal awal (0 = atas, 1 = bawah) dan lebar area teks (rasio lebar layar)
PosYRatio=0.28
WidthRatio=0.28
; Font
FontName=Arial
FontPx=15

[Move]
; Pengaturan mode geser (/lcmove). Tidak ada tombol pintasan di luar mode ini.
; 1 = boleh geser dengan mouse, 0 = tidak
MouseDrag=1
; 1 = boleh geser dengan tombol panah (hanya aktif saat mode geser), 0 = tidak
ArrowKeys=1

[Position]
; Diisi otomatis saat posisi disimpan. Hapus kedua baris ini (atau jalankan /lcreset) untuk kembali ke posisi awal.
X=20
Y=-1
